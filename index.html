<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN ARG Rainfall Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom Styles for Dashboard and Cards -->
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #dashboard-container { display: flex; height: 100vh; }
        #map { flex: 2; height: 100%; }
        #sidebar { flex: 1; padding: 20px; overflow-y: auto; background-color: #f8f9fa; }
        
        /* Story Card specific hidden container for html2canvas */
        #export-card-container {
            position: absolute;
            left: -9999px;
            width: 1080px;
            height: 1920px;
            background: white;
        }
        
        .controls { margin-bottom: 20px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

    <div id="dashboard-container">
        <!-- Main Map Interface -->
        <div id="map"></div>

        <!-- Sidebar / Filters / Charts -->
        <div id="sidebar">
            <h2>TNDRRA Rainfall Tracker</h2>
            
            <div class="controls">
                <label for="yearSelect"><strong>Select Year:</strong></label>
                <select id="yearSelect" onchange="loadYearData()">
                    <option value="2026" selected>2026</option>
                    <option value="2025">2025</option>
                </select>
                
                <button onclick="exportStoryCard()">Export 9:16 Story Card</button>
            </div>

            <!-- Chart.js Canvas -->
            <div class="chart-container">
                <canvas id="dailyTrendChart"></canvas>
            </div>

            <!-- Station Data Table -->
            <div id="table-container">
                <h3>Daily Extremes</h3>
                <table id="dataTable" border="1" width="100%" style="border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th>District</th>
                            <th>Station</th>
                            <th>Total (mm)</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hidden Container for High-Res Image Export (html2canvas) -->
    <div id="export-card-container">
        <div id="export-header">TNDRRA 24-Hour Rainfall Summary</div>
        <div id="export-map-snapshot"></div>
        <div id="export-footer">Source: TNDRRA | Generated by @HaiyanTip</div>
    </div>

    <!-- External Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([10.7905, 78.7047], 7); // Centered on Tamil Nadu
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let geojsonLayer;
        let stationMarkers = L.layerGroup().addTo(map);

      // 2. Dynamic Data Loading Function
        function loadYearData() {
            const selectedYear = document.getElementById('yearSelect').value;
            const summaryFile = `tndrra_${selectedYear}_summary.csv`; 

            Papa.parse(summaryFile, {
                download: true,
                header: true,
                skipEmptyLines: true,
                dynamicTyping: true,
                complete: function(results) {
                    const allData = results.data;
                    
                    // FILTER FIX: Remove empty rows
                    const validData = allData.filter(row => row.date && row.latitude && row.longitude);
                    
                    if (validData.length === 0) return;

                    // Get the most recent date (the last date added to the bottom of the CSV)
                    const latestDate = validData[validData.length - 1].date;
                    
                    // Isolate ONLY the records for that specific date
                    const singleDayData = validData.filter(row => row.date === latestDate);
                    
                    console.log(`Loaded ${singleDayData.length} records for ${latestDate}`);
                    
                    // Pass ONLY today's data to the map and table
                    updateMapMarkers(singleDayData);
                    updateDashboardTable(singleDayData);
                },
                error: function(err) {
                    console.error("Error loading CSV:", err);
                    alert(`Could not load data for ${selectedYear}. Make sure ${summaryFile} exists in the repository.`);
                }
            });
        }

        // 3. Update Markers
        function updateMapMarkers(data) {
            stationMarkers.clearLayers();
            data.forEach(row => {
                if(row.latitude && row.longitude && row.total !== null) {
                    const marker = L.circleMarker([row.latitude, row.longitude], {
                        radius: 6,
                        fillColor: getColorByIntensity(row.total),
                        color: "#000",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });
                    
                    marker.bindPopup(`<b>${row.station_name}</b> (${row.district_name})<br>Rainfall: ${row.total} mm`);
                    stationMarkers.addLayer(marker);
                }
            });
        }

        // 4. Color Palette matching IMD categories
        function getColorByIntensity(val) {
            if (val > 204.4) return '#FF0000'; // Extremely Heavy
            if (val > 115.5) return '#FF9933'; // Very Heavy
            if (val > 64.4) return '#FFFF00';  // Heavy
            if (val > 15.5) return '#00FFFF';  // Moderate
            if (val > 0) return '#00FF00';     // Light
            return '#D3D3D3';                  // No Rain
        }

        // 5. Update UI Table
        function updateDashboardTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // Sort by highest rainfall
            const sortedData = data.sort((a, b) => b.total - a.total).slice(0, 15);
            
            sortedData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.district_name}</td>
                    <td>${row.station_name}</td>
                    <td><b>${row.total}</b></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 6. html2canvas Export Function
        function exportStoryCard() {
            const target = document.getElementById('export-card-container');
            // Move container into viewport briefly to render properly if needed, 
            // then use html2canvas to capture the snapshot.
            
            html2canvas(target, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `TNDRRA_Rainfall_Summary_${new Date().toISOString().split('T')[0]}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // Initial Load on Page Boot
        loadYearData();

    </script>
</body>
</html>
